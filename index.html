function addDaysISO(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function parseDateOnly(v){const [y,m,d]=String(v).split('-').map(Number);return new Date(y,m-1,d)}

function purchaseClosedMessage(){const s=schedule();const now=dateOnly(),end=parseDateOnly(s.purchaseEnd),start=parseDateOnly(s.purchaseStart);if(now<start)return `🗓️ Pembelian belum dibuka. Periode pembelian: ${scheduleText()}.`;if(now>end)return `⛔ Periode pembelian sudah berakhir pada ${formatShortDate(s.purchaseEnd)}. Pesanan baru tidak dapat dibuat.`;return ''}
function pickupInfo(queueNumber){const n=Number(String(queueNumber).replace(/\D/g,''))||0;if(!n)return null;const s=schedule(),start=parseDateOnly(s.pickupStart),end=parseDateOnly(s.pickupEnd);let dayOffset=Math.floor((n-1)/100);const maxDays=Math.max(0,Math.round((end-start)/86400000));dayOffset=Math.min(dayOffset,maxDays);const date=new Date(start);date.setDate(start.getDate()+dayOffset);const pos=((n-1)%100)+1;const minutes=Math.max(0,pos-1)*3;const h=8+Math.floor(minutes/60),m=minutes%60;return {date,time:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`,position:pos,group:`${dayOffset*100+1}–${Math.min((dayOffset+1)*100,999)}`,label:formatShortDate(date)}}

<header class="topbar">
 <div class="brand"><div class="brand-logo"><i class="fa-solid fa-shirt"></i></div><span>Toko Seragam<br><small>SMAN 12 PADANG</small></span></div>
 <div class="search"><input placeholder="Cari produk..." value="${esc(state.search)}" oninput="state.search=this.value;renderPageOnly()"><i class="fa-solid fa-magnifying-glass"></i></div>
 <div class="top-actions">
  <button class="icon-btn hide-mobile" onclick="go('notifications')" title="Notifikasi"><i class="fa-regular fa-bell"></i>${notifBadge()}</button>
  ${isBuyer?`<button class="icon-btn" onclick="go('cart')" title="Keranjang"><i class="fa-solid fa-cart-shopping"></i><span class="badge">${cart().reduce((a,x)=>a+x.qty,0)||''}</span></button>`:''}
  <button class="icon-btn" onclick="go('profile')" title="Profil"><i class="fa-solid fa-user"></i></button>
 </div>
</header>
<div class="layout">
<aside class="sidebar">
 <div class="nav-title">${isBuyer?'Menu Pembeli':'Menu Penjual'}</div>
 ${isBuyer?navItem('home','fa-house','Beranda')+navItem('products','fa-shirt','Produk')+navItem('cart','fa-cart-shopping','Keranjang')+navItem('orders','fa-box','Pesanan Saya')+navItem('history','fa-clock-rotate-left','Riwayat Pembelian')+navItem('queue','fa-ticket','Antrean')+navItem('wishlist','fa-heart','Wishlist')+navItem('notifications','fa-bell','Notifikasi')+navItem('profile','fa-user','Profil'):navItem('sellerHome','fa-chart-pie','Dashboard')+navItem('sellerOrders','fa-box-open','Pesanan Masuk')+navItem('prepare','fa-list-check','Pesanan Disiapkan')+navItem('sellerQueue','fa-ticket','Manajemen Antrean')+navItem('manageProducts','fa-shirt','Manajemen Produk')+navItem('stock','fa-boxes-stacked','Stok')+navItem('vouchers','fa-ticket-simple','Voucher')+navItem('reports','fa-chart-column','Laporan')+navItem('schedule','fa-calendar-days','Jadwal')+navItem('notifications','fa-bell','Notifikasi')+navItem('profile','fa-user','Profil')}
 <div class="nav-title">Akun</div><button class="nav-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>Logout</button>
</aside>
<main class="content" id="content">${content}</main>
</div>
${isBuyer?`<nav class="mobile-nav">${navItemMobile('home','fa-house','Beranda')}${navItemMobile('products','fa-shirt','Produk')}${navItemMobile('cart','fa-cart-shopping','Keranjang')}${navItemMobile('queue','fa-ticket','Antrean')}${navItemMobile('profile','fa-user','Profil')}</nav>`:`<nav class="mobile-nav">${navItemMobile('sellerHome','fa-chart-pie','Dashboard')}${navItemMobile('sellerOrders','fa-box','Pesanan')}${navItemMobile('sellerQueue','fa-ticket','Antrean')}${navItemMobile('manageProducts','fa-shirt','Produk')}${navItemMobile('profile','fa-user','Profil')}</nav>`}
</div>`
}
function navItemMobile(id,icon,label){return `<button class="${state.page===id?'active':''}" onclick="go('${id}')"><i class="fa-solid ${icon}"></i>${label}</button>`}
function notifBadge(){let n=db.notifications.filter(x=>x.userId===current()?.id&&!x.read).length;return n?`<span class="badge">${n}</span>`:''}
function renderBuyer(){let c='';switch(state.page){case'home':c=buyerHome();break;case'products':c=productsPage();break;case'cart':c=cartPage();break;case'orders':c=ordersPage(false);break;case'history':c=ordersPage(true);break;case'queue':c=queuePage();break;case'wishlist':c=wishlistPage();break;case'notifications':c=notificationsPage();break;case'profile':c=profilePage();break;default:c=buyerHome();state.page='home'}document.getElementById('root').innerHTML=shell('buyer',c)}
function renderSeller(){if(!requireSeller())return;let c='';switch(state.page){case'sellerHome':c=sellerHome();break;case'sellerOrders':c=sellerOrders();break;case'prepare':c=preparePage();break;case'sellerQueue':c=sellerQueue();break;case'manageProducts':c=manageProducts();break;case'stock':c=stockPage();break;case'vouchers':c=vouchersPage();break;case'reports':c=reportsPage();break;case'schedule':c=schedulePage();break;case'notifications':c=notificationsPage();break;case'profile':c=profilePage();break;default:c=sellerHome();state.page='sellerHome'}document.getElementById('root').innerHTML=shell('seller',c)}
function renderPageOnly(){const el=document.getElementById('content');if(!el)return;let c=current().role==='buyer'?({home:buyerHome,products:productsPage,cart:cartPage,orders:()=>ordersPage(false),history:()=>ordersPage(true),queue:queuePage,wishlist:wishlistPage,notifications:notificationsPage,profile:profilePage}[state.page]||buyerHome)():({sellerHome:sellerHome,sellerOrders:sellerOrders,prepare:preparePage,sellerQueue:sellerQueue,manageProducts:manageProducts,stock:stockPage,vouchers:vouchersPage,reports:reportsPage,schedule:schedulePage,notifications:notificationsPage,profile:profilePage}[state.page]||sellerHome)();el.innerHTML=c}

/* =========================
   BUYER
   ========================= */
function buyerHome(){
const u=current(), active=db.queues.find(q=>q.userId===u.id&&!['Selesai','Dibatalkan'].includes(q.status));
return `<div class="hero"><div><h1>Selamat datang, ${esc(u.name)}! 👋</h1><p>Lengkapi kebutuhan seragam sekolahmu dengan mudah. Semua produk khusus <b>${SCHOOL}</b>.</p><button class="btn btn-light" onclick="go('products')"><i class="fa-solid fa-bag-shopping"></i>Belanja Sekarang</button></div><div class="hero-emoji">🎓</div></div>
${active?`<div class="section"><div class="notice"><b>🎫 Antrean Anda: ${active.number}</b> — ${esc(active.status)}. <button class="btn btn-primary" style="margin-left:8px;padding:7px 10px" onclick="go('queue')">Lihat Antrean</button></div></div>`:''}
<div class="section"><div class="panel"><div class="section-head"><h3 style="margin:0">🗓️ Jadwal Pembelian & Pengambilan</h3><span class="tag">SMAN 12 PADANG</span></div><div class="two-col"><div><b>Periode pembelian</b><p class="small muted">${scheduleText()}</p><b>Tanggal pengambilan</b><p class="small muted">${pickupScheduleText()}</p></div><div class="notice ${purchaseWindow()?'success-note':''}">${purchaseWindow()?'🟢 Pembelian sedang dibuka.':'⛔ '+purchaseClosedMessage()}<br><span class="small">Antrean 1–100: hari pertama pengambilan • 101–200: hari kedua • 201–300: hari ketiga.</span></div></div></div></div><div class="section"><div class="section-head"><h2>Produk Populer</h2><button class="btn btn-outline" onclick="go('products')">Lihat Semua</button></div><div class="grid">${db.products.slice(0,4).map(productCard).join('')}</div></div>
<div class="section"><div class="section-head"><h2>Hampir Habis</h2></div><div class="grid">${db.products.filter(p=>stockState(p)==='low').slice(0,4).map(productCard).join('')||`<div class="panel">Belum ada produk yang hampir habis.</div>`}</div></div>
<div class="section two-col"><div class="panel"><h3>🎟️ Voucher Aktif</h3>${db.vouchers.map(v=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(v.code)}</b><span class="tag">${v.type==='percent'?v.value+'%':'Potongan '+money(v.value)}</span></div>`).join('')}</div><div class="panel"><h3>🏫 Informasi Toko</h3><p class="muted">Toko seragam resmi untuk kebutuhan siswa <b>${SCHOOL}</b>.</p><p class="small">Pembayaran menggunakan QRIS simulasi. Pengambilan mengikuti antrean digital.</p></div></div>`
}
function productCard(p){
let size=Object.keys(p.sizes)[0], s=p.sizes[size], wish=(db.wishlist[current().id]||[]).includes(p.id), st=stockState(p);
return `<article class="product"><div class="product-img"><img src="${esc(productImg(p))}" alt="${esc(p.name)}" onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<span style=\\'font-size:60px\\'>${p.emoji||'👕'}</span>')"><button class="heart ${wish?'on':''}" onclick="toggleWish('${p.id}',event)"><i class="${wish?'fa-solid':'fa-regular'} fa-heart"></i></button></div><div class="product-body"><span class="tag">${esc(p.category)}</span><div class="product-title" style="margin-top:8px">${esc(p.name)}</div><div class="school-label">🏫 ${SCHOOL}</div><div class="price">Mulai ${money(s.price)}</div><div class="stock ${st}">${st==='out'?'🔴':st==='low'?'🟡':'🟢'} ${stockLabel(p)}</div><button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="openProduct('${p.id}')">Lihat Produk</button></div></article>`
}
function productsPage(){
let arr=db.products.filter(p=>{let q=state.search.toLowerCase();return (!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))&& (state.category==='Semua'||p.category===state.category)&&(state.size==='Semua'||p.sizes[state.size])});
if(state.size!=='Semua')arr=arr.filter(p=>p.sizes[state.size].stock>0);
if(state.sort==='low')arr.sort((a,b)=>Object.values(a.sizes).reduce((x,y)=>x+y.stock,0)-Object.values(b.sizes).reduce((x,y)=>x+y.stock,0));
if(state.sort==='cheap')arr.sort((a,b)=>Math.min(...Object.values(a.sizes).map(x=>x.price))-Math.min(...Object.values(b.sizes).map(x=>x.price)));
return `<h1 class="page-title">Katalog Seragam</h1><div class="subtitle">Produk khusus ${SCHOOL}</div><div class="toolbar"><select onchange="state.category=this.value;renderPageOnly()"><option>Semua</option>${[...new Set(db.products.map(p=>p.category))].map(x=>`<option ${state.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="state.size=this.value;renderPageOnly()"><option>Semua</option>${['S','M','L','XL','XXL'].map(x=>`<option ${state.size===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="state.sort=this.value;renderPageOnly()"><option value="default">Urutan standar</option><option value="cheap" ${state.sort==='cheap'?'selected':''}>Harga termurah</option><option value="low" ${state.sort==='low'?'selected':''}>Stok terendah</option></select></div><div class="grid">${arr.map(productCard).join('')||`<div class="panel">Tidak ada produk yang sesuai.</div>`}</div>`
}
function openProduct(id){state.selectedProduct=id;state.selectedSize=Object.keys(db.products.find(p=>p.id===id).sizes)[0];state.selectedQty=1;showModal(productDetailModal())}
function productDetailModal(){
const p=db.products.find(x=>x.id===state.selectedProduct),s=p.sizes[state.selectedSize],st=s.stock;
return `<div class="modal"><div class="modal-head"><h3>Detail Produk</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="two-col"><div><img src="${esc(productImg(p))}" style="width:100%;height:300px;object-fit:cover;border-radius:15px" onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<div style=\\'font-size:100px;text-align:center;padding:70px\\'>${p.emoji||'👕'}</div>')"></div><div><span class="tag">${esc(p.category)}</span><h2>${esc(p.name)}</h2><p class="muted">🏫 ${SCHOOL}</p><p>${esc(p.desc)}</p><label class="small"><b>Ukuran</b></label><div class="toolbar" style="margin-top:7px">${Object.entries(p.sizes).map(([z,v])=>`<button class="btn ${state.selectedSize===z?'btn-primary':'btn-outline'}" ${v.stock<=0?'disabled':''} onclick="state.selectedSize='${z}';state.selectedQty=1;showModal(productDetailModal())">${z}${v.stock<=0?' • habis':''}</button>`).join('')}</div><div class="price" style="font-size:22px">${money(s.price)}</div><div class="stock ${s.stock<=0?'out':s.stock<=3?'low':'ok'}">${s.stock<=0?'🔴 STOK HABIS':'Stok tersedia: '+s.stock}</div>${s.stock>0?`<div class="qty" style="margin:15px 0"><button onclick="state.selectedQty=Math.max(1,state.selectedQty-1);showModal(productDetailModal())">−</button><b>${state.selectedQty}</b><button onclick="state.selectedQty=Math.min(safeMaxQty('${p.id}','${state.selectedSize}'),state.selectedQty+1);showModal(productDetailModal())">+</button></div><div class="flex"><button class="btn btn-primary" onclick="addToCart('${p.id}','${state.selectedSize}',${state.selectedQty})"><i class="fa-solid fa-cart-plus"></i>Tambah ke Keranjang</button><button class="btn btn-outline" onclick="buyNow('${p.id}','${state.selectedSize}',${state.selectedQty})">Beli Sekarang</button></div>`:`<button class="btn btn-outline" style="margin-top:15px" onclick="restockRequest('${p.id}','${state.selectedSize}')"><i class="fa-regular fa-bell"></i> Ingatkan Saya Saat Restock</button>`}</div></div></div></div>`
}
function safeMaxQty(pid,size){const p=db.products.find(x=>x.id===pid),existing=cart().find(x=>x.productId===pid&&x.size===size);return Math.max(0,(p?.sizes[size]?.stock||0)-(existing?.qty||0))}
function addToCart(pid,size,qty=1){if(!requireBuyer())return;if(!purchaseWindow())return toast(purchaseClosedMessage());const p=db.products.find(x=>x.id===pid),s=p?.sizes[size];if(!s||s.stock<=0)return toast('⚠️ Ukuran tersebut sedang habis.');const c=cart(),found=c.find(x=>x.productId===pid&&x.size===size);if((found?.qty||0)+qty>s.stock)return toast(`⚠️ Stok tidak mencukupi. Tersedia hanya ${s.stock}.`);if(found)found.qty+=qty;else c.push({id:uid('cart'),productId:pid,size,qty});setCart(c);closeModal();toast('🛒 Produk ditambahkan ke keranjang.');renderPageOnly()}
function buyNow(pid,size,qty){if(!purchaseWindow())return toast(purchaseClosedMessage());addToCart(pid,size,qty);if(cart().length)go('cart')}
function toggleWish(pid,e){e.stopPropagation();const u=current(),w=db.wishlist[u.id]||[];db.wishlist[u.id]=w.includes(pid)?w.filter(x=>x!==pid):[...w,pid];saveDB();renderPageOnly();toast(w.includes(pid)?'❤️ Dihapus dari wishlist.':'❤️ Ditambahkan ke wishlist.')}
function restockRequest(pid,size){const u=current();if(db.restockRequests.some(r=>r.userId===u.id&&r.productId===pid&&r.size===size&&r.active))return toast('Anda sudah meminta notifikasi restock.');db.restockRequests.push({id:uid('rr'),userId:u.id,productId:pid,size,active:true});saveDB();notify(u.id,'Permintaan restock tersimpan',`Anda akan diberi tahu saat ${db.products.find(p=>p.id===pid).name} ukuran ${size} tersedia.`);closeModal();toast('🔔 Permintaan restock disimpan.')}
function cartPage(){
const c=cart();let subtotal=0;c.forEach(i=>{const p=db.products.find(x=>x.id===i.productId);subtotal+=(p?.sizes[i.size]?.price||0)*i.qty});let disc=state.appliedVoucher?calcDiscount(state.appliedVoucher,subtotal):0;
return `<h1 class="page-title">🛒 Keranjang</h1><div class="subtitle">Periksa produk dan ukuran sebelum checkout.</div>${!c.length?`<div class="panel center" style="padding:50px"><div style="font-size:50px">🛒</div><h3>Keranjang masih kosong.</h3><button class="btn btn-primary" onclick="go('products')">Belanja Sekarang</button></div>`:`<div class="two-col"><div class="panel">${c.map(cartItem).join('')}</div><div class="panel"><h3>Ringkasan</h3><div class="field"><label>Kode Voucher</label><div class="flex"><input id="voucherInput" placeholder="SERAGAM10" value="${esc(state.appliedVoucher?.code||'')}"><button class="btn btn-primary" onclick="applyVoucher()">Pakai</button></div></div>${state.appliedVoucher?`<div class="notice success-note" style="margin-top:10px">✓ ${esc(state.appliedVoucher.code)} berhasil digunakan.</div>`:''}<div style="margin-top:18px"><div class="summary-row"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="summary-row"><span>Diskon</span><b>-${money(disc)}</b></div><div class="summary-row total"><span>Total</span><b>${money(subtotal-disc)}</b></div></div><button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="startCheckout()">Checkout</button></div></div>`}`
}
function cartItem(i){const p=db.products.find(x=>x.id===i.productId),s=p?.sizes[i.size];return `<div class="cart-item"><img class="cart-img" src="${esc(productImg(p))}" onerror="this.style.display='none'"><div class="cart-info"><b>${esc(p?.name||'Produk')}</b><div class="small muted">Ukuran ${i.size} • ${money(s?.price||0)}</div><div class="qty" style="margin-top:8px"><button onclick="changeCart('${i.id}',-1)">−</button><b>${i.qty}</b><button onclick="changeCart('${i.id}',1)">+</button><button class="btn btn-danger" style="padding:6px 9px;margin-left:6px" onclick="removeCart('${i.id}')"><i class="fa-solid fa-trash"></i></button></div></div><b>${money((s?.price||0)*i.qty)}</b></div>`}
function changeCart(id,d){const c=cart(),i=c.find(x=>x.id===id),p=db.products.find(x=>x.id===i.productId);if(i.qty+d>p.sizes[i.size].stock)return toast(`⚠️ Stok tidak mencukupi. Tersedia hanya ${p.sizes[i.size].stock}.`);i.qty+=d;if(i.qty<=0)c.splice(c.indexOf(i),1);setCart(c);renderPageOnly()}
function removeCart(id){setCart(cart().filter(x=>x.id!==id));renderPageOnly();toast('Item dihapus.')}
function applyVoucher(){const code=(document.getElementById('voucherInput')?.value||'').trim().toUpperCase(),v=db.vouchers.find(x=>x.code===code);if(!v)return toast('Voucher tidak valid.');if(new Date(v.expires+'T23:59:59')<new Date())return toast('Voucher sudah tidak berlaku.');if(v.used>=v.limit)return toast('Batas penggunaan voucher sudah habis.');state.appliedVoucher=v;renderPageOnly();toast('Voucher berhasil digunakan!')}
function calcDiscount(v,subtotal){if(!v)return 0;return Math.min(subtotal,v.type==='percent'?subtotal*v.value/100:v.value)}
function startCheckout(){if(!purchaseWindow())return toast(purchaseClosedMessage());if(!cart().length)return toast('🛒 Keranjang kosong.');for(const i of cart()){const p=db.products.find(x=>x.id===i.productId);if(!p||!p.sizes[i.size]||i.qty>p.sizes[i.size].stock)return toast(`⚠️ Stok ${p?.name||'produk'} ukuran ${i.size} tidak mencukupi.`)}state.checkoutStep=1;state.checkoutData={name:current().name,phone:current().phone,email:current().email,className:current().className||'',gender:current().gender||'',note:''};showModal(checkoutModal())}
function checkoutModal(){return `<div class="modal"><div class="modal-head"><h3>Checkout</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${checkoutSteps()}${state.checkoutStep===1?checkoutDataStep():state.checkoutStep===2?reviewStep():state.checkoutStep===3?paymentStep():successQueueStep()}</div></div>`}
function checkoutSteps(){return `<div class="steps">${[['Data Pembeli',1],['Review Pesanan',2],['QRIS',3],['Antrean',4]].map((x,i)=>`<div class="step ${state.checkoutStep>=x[1]?'active':''}"><span>${x[1]}</span>${x[0]}</div>${i<3?'<div class="line"></div>':''}`).join('')}</div>`}
function checkoutDataStep(){let d=state.checkoutData;return `<h3>Isi Data Pembeli</h3><p class="muted small">Data wajib lengkap sebelum pembayaran.</p><div class="form-grid"><div class="field"><label>Nama lengkap *</label><input id="coName" value="${esc(d.name)}"></div><div class="field"><label>Nomor HP *</label><input id="coPhone" value="${esc(d.phone)}"></div><div class="field"><label>Email *</label><input id="coEmail" type="email" value="${esc(d.email)}"></div><div class="field"><label>Kelas *</label><input id="coClass" placeholder="XI F1" value="${esc(d.className)}"></div><div class="field"><label>Jenis kelamin *</label><select id="coGender"><option value="">Pilih</option><option ${d.gender==='Laki-laki'?'selected':''}>Laki-laki</option><option ${d.gender==='Perempuan'?'selected':''}>Perempuan</option></select></div><div class="field full"><label>Catatan pesanan</label><textarea id="coNote">${esc(d.note)}</textarea></div></div><div class="right" style="margin-top:16px"><button class="btn btn-primary" onclick="saveCheckoutData()">Lanjut ke Review <i class="fa-solid fa-arrow-right"></i></button></div>`}
function saveCheckoutData(){const d={name:document.getElementById('coName').value.trim(),phone:document.getElementById('coPhone').value.trim(),email:document.getElementById('coEmail').value.trim(),className:document.getElementById('coClass').value.trim(),gender:document.getElementById('coGender').value,note:document.getElementById('coNote').value.trim()};if(!d.name||!d.phone||!d.email||!d.className||!d.gender)return toast('⚠️ Lengkapi semua data wajib.');state.checkoutData=d;state.checkoutStep=2;showModal(checkoutModal())}
function reviewStep(){let sub=cart().reduce((a,i)=>{let p=db.products.find(x=>x.id===i.productId);return a+p.sizes[i.size].price*i.qty},0),disc=calcDiscount(state.appliedVoucher,sub);return `<h3>Periksa Pesanan Anda</h3><div class="two-col"><div><div class="panel" style="box-shadow:none;background:#fafbfd"><b>Data Pembeli</b><p class="small">Nama: ${esc(state.checkoutData.name)}<br>Kelas: ${esc(state.checkoutData.className)}<br>No HP: ${esc(state.checkoutData.phone)}<br>Email: ${esc(state.checkoutData.email)}<br>Jenis: ${esc(state.checkoutData.gender)}<br>Catatan: ${esc(state.checkoutData.note||'-')}</p></div>${cart().map(i=>{const p=db.products.find(x=>x.id===i.productId),s=p.sizes[i.size];return `<div class="cart-item"><img class="cart-img" src="${esc(productImg(p))}"><div class="cart-info"><b>${esc(p.name)}</b><div>${i.size} × ${i.qty}</div></div><b>${money(s.price*i.qty)}</b></div>`}).join('')}</div><div class="panel"><div class="summary-row"><span>Subtotal</span><b>${money(sub)}</b></div><div class="summary-row"><span>Voucher</span><b>-${money(disc)}</b></div><div class="summary-row total"><span>Total</span><b>${money(sub-disc)}</b></div></div></div><div class="right" style="margin-top:16px"><button class="btn btn-outline" onclick="state.checkoutStep=1;showModal(checkoutModal())">✏️ Edit Data</button><button class="btn btn-outline" onclick="closeModal();go('cart')">✏️ Edit Pesanan</button><button class="btn btn-primary" onclick="state.checkoutStep=3;showModal(checkoutModal())">Lanjut ke Pembayaran</button></div>`}
function checkoutTotal(){let sub=cart().reduce((a,i)=>{let p=db.products.find(x=>x.id===i.productId);return a+p.sizes[i.size].price*i.qty},0);return sub-calcDiscount(state.appliedVoucher,sub)}
function paymentStep(){return `<div class="center"><h3>📱 Pembayaran QRIS</h3><p class="muted">QRIS ini hanya simulasi dan tidak memindahkan uang sungguhan.</p><div class="qr"></div><h2>${money(checkoutTotal())}</h2><span class="status orange">🟡 Menunggu Pembayaran</span><div class="notice" style="margin:15px 0">Pembayaran hanya menggunakan QRIS simulasi. Tidak tersedia pembayaran di tempat.</div><button class="btn btn-primary" onclick="simulatePayment()">✓ Simulasikan Pembayaran Berhasil</button></div>`}

function queueAction(id,action){let q=db.queues.find(x=>x.id===id),o=db.orders.find(x=>x.id===q.orderId);if(action==='skip'){q.status='Menunggu';notify(q.userId,'Antrean dilewati sementara',`Antrean ${q.number} dilewati sementara.`)}else{q.status='Selesai';if(o){o.status='Selesai';o.timeline[4]={label:'Selesai',done:true,time:new Date().toISOString()};notify(q.userId,'Antrean selesai',`Antrean ${q.number} selesai dilayani.`)}}saveDB();renderPageOnly()}
function manageProducts(){return `<div class="between"><div><h1 class="page-title">👕 Manajemen Produk</h1><div class="subtitle">Semua produk otomatis untuk ${SCHOOL}.</div></div><button class="btn btn-primary" onclick="productEditor()">+ Tambah Produk</button></div><div class="grid">${db.products.map(p=>`<div class="product"><div class="product-img"><img src="${esc(p.image)}"></div><div class="product-body"><b>${esc(p.name)}</b><div class="school-label">${SCHOOL}</div><div class="small muted">${esc(p.category)}</div><div class="flex" style="margin-top:10px"><button class="btn btn-outline" onclick="productEditor('${p.id}')">Edit</button><button class="btn btn-danger" onclick="deleteProduct('${p.id}')">Hapus</button></div></div></div>`).join('')}</div>`}
function productEditor(id){let p=id?db.products.find(x=>x.id===id):{name:'',category:'Baju putih',desc:'',image:'',sizes:{S:{price:0,stock:0},M:{price:0,stock:0},L:{price:0,stock:0},XL:{price:0,stock:0},XXL:{price:0,stock:0}}};showModal(`<div class="modal"><div class="modal-head"><h3>${id?'Edit':'Tambah'} Produk</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field full"><label>Nama produk *</label><input id="epName" value="${esc(p.name)}"></div><div class="field"><label>Kategori</label><select id="epCat">${['Baju putih','Baju batik','Baju basiba','Baju olahraga','Dasi','Topi','Celana abu-abu','Celana olahraga','Jaket/seragam tambahan','Atribut sekolah','Paket seragam'].map(x=>`<option ${p.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>URL gambar</label><input id="epImg" value="${esc(p.image||'')}"></div><div class="field full"><label>Deskripsi</label><textarea id="epDesc">${esc(p.desc)}</textarea></div>${['S','M','L','XL','XXL'].map(z=>`<div class="field"><label>${z} - Harga</label><input type="number" id="price${z}" value="${p.sizes[z]?.price||0}"><label style="margin-top:6px">${z} - Stok</label><input type="number" min="0" id="stock${z}" value="${p.sizes[z]?.stock||0}"></div>`).join('')}</div><button class="btn btn-primary" style="margin-top:16px" onclick="saveProduct('${id||''}')">Simpan Produk</button></div></div>`)}
function saveProduct(id){const p=id?db.products.find(x=>x.id===id):{id:uid('p'),emoji:'👕'};p.name=document.getElementById('epName').value.trim();p.category=document.getElementById('epCat').value;p.image=document.getElementById('epImg').value.trim()||img('1521572163474-6864f9cf17ab','uniform');p.desc=document.getElementById('epDesc').value.trim();p.school=SCHOOL;p.sizes={};for(const z of ['S','M','L','XL','XXL'])p.sizes[z]={price:Math.max(0,Number(document.getElementById('price'+z).value)||0),stock:Math.max(0,Number(document.getElementById('stock'+z).value)||0)};if(!id)db.products.push(p);const changed=Object.keys(p.sizes).filter(z=>p.sizes[z].stock>0);changed.forEach(z=>db.restockRequests.filter(r=>r.productId===p.id&&r.size===z&&r.active).forEach(r=>{r.active=false;notify(r.userId,'Produk tersedia kembali',`${p.name} ukuran ${z} sekarang tersedia.`)}));saveDB();closeModal();toast('Produk berhasil disimpan.');renderPageOnly()}
function deleteProduct(id){if(!confirm('Hapus produk ini?'))return;db.products=db.products.filter(p=>p.id!==id);saveDB();toast('Produk dihapus.');renderPageOnly()}
function stockPage(){return `<h1 class="page-title">📦 Manajemen Stok</h1><div class="subtitle">Atur stok dan harga per ukuran.</div>${db.products.map(p=>`<div class="panel" style="margin-bottom:12px"><div class="between"><b>${esc(p.name)}</b><span class="school-label">${SCHOOL}</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Ukuran</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${Object.entries(p.sizes).map(([z,s])=>`<tr><td><b>${z}</b></td><td>${money(s.price)}</td><td>${s.stock}</td><td><span class="stock ${s.stock===0?'out':s.stock<=3?'low':'ok'}">${s.stock===0?'🔴 Habis':s.stock<=3?'🟡 Hampir habis':'🟢 Tersedia'}</span></td><td><button class="btn btn-outline" onclick="stockEditor('${p.id}','${z}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div>`).join('')}`}
function stockEditor(pid,z){const p=db.products.find(x=>x.id===pid),s=p.sizes[z];showModal(`<div class="modal"><div class="modal-head"><h3>Edit Stok ${z}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Harga</label><input id="sePrice" type="number" value="${s.price}"></div><div class="field" style="margin-top:12px"><label>Stok</label><input id="seStock" type="number" min="0" value="${s.stock}"></div><button class="btn btn-primary" style="margin-top:15px" onclick="saveStock('${pid}','${z}')">Simpan</button></div></div>`)}
function saveStock(pid,z){const p=db.products.find(x=>x.id===pid),old=p.sizes[z].stock;p.sizes[z].price=Math.max(0,Number(document.getElementById('sePrice').value)||0);p.sizes[z].stock=Math.max(0,Number(document.getElementById('seStock').value)||0);if(old===0&&p.sizes[z].stock>0){db.restockRequests.filter(r=>r.productId===pid&&r.size===z&&r.active).forEach(r=>{r.active=false;notify(r.userId,'Produk tersedia kembali',`${p.name} ukuran ${z} sekarang tersedia.`)})}saveDB();closeModal();toast('Stok diperbarui.');renderPageOnly()}
function schedulePage(){const s=schedule();return `<div class="between"><div><h1 class="page-title">🗓️ Pengaturan Jadwal</h1><div class="subtitle">Penjual dapat mengubah periode pembelian dan tanggal pengambilan kapan saja.</div></div><span class="tag">${SCHOOL}</span></div><div class="panel"><h3>Periode Pembelian</h3><div class="form-grid"><div class="field"><label>Mulai pembelian</label><input id="schPurchaseStart" type="date" value="${s.purchaseStart}"></div><div class="field"><label>Akhir pembelian</label><input id="schPurchaseEnd" type="date" value="${s.purchaseEnd}"></div></div><div class="notice" style="margin-top:12px">Setelah tanggal akhir pembelian lewat, pembeli otomatis tidak dapat membuat pesanan baru.</div></div><div class="panel" style="margin-top:15px"><h3>Tanggal Pengambilan</h3><div class="form-grid"><div class="field"><label>Pengambilan mulai</label><input id="schPickupStart" type="date" value="${s.pickupStart}"></div><div class="field"><label>Pengambilan sampai</label><input id="schPickupEnd" type="date" value="${s.pickupEnd}"></div></div><div class="notice" style="margin-top:12px">Antrean 1–100 mendapat hari pertama, 101–200 hari kedua, 201–300 hari ketiga, dan seterusnya. Estimasi jam dihitung otomatis.</div></div><button class="btn btn-primary" style="margin-top:15px" onclick="saveSchedule()">💾 Simpan Jadwal</button>`}
function saveSchedule(){const ps=document.getElementById('schPurchaseStart').value,pe=document.getElementById('schPurchaseEnd').value,ds=document.getElementById('schPickupStart').value,de=document.getElementById('schPickupEnd').value;if(!ps||!pe||!ds||!de)return toast('Semua tanggal wajib diisi.');if(ps>pe)return toast('Tanggal akhir pembelian harus setelah tanggal mulai.');if(ds>de)return toast('Tanggal akhir pengambilan harus setelah tanggal mulai.');db.settings.purchaseStart=ps;db.settings.purchaseEnd=pe;db.settings.pickupStart=ds;db.settings.pickupEnd=de;saveDB();toast('Jadwal berhasil diperbarui.');renderPageOnly()}
function vouchersPage(){return `<div class="between"><div><h1 class="page-title">🎟️ Voucher</h1><div class="subtitle">Atur kode promo toko.</div></div><button class="btn btn-primary" onclick="voucherEditor()">+ Tambah Voucher</button></div>${db.vouchers.map(v=>`<div class="order-card"><div class="order-top"><b>${esc(v.code)}</b><span class="tag">${v.type==='percent'?v.value+'%':'Potongan '+money(v.value)}</span></div><div class="small muted">Berlaku sampai ${v.expires} • Dipakai ${v.used}/${v.limit}</div><div class="flex" style="margin-top:10px"><button class="btn btn-outline" onclick="voucherEditor('${v.id}')">Edit</button><button class="btn btn-danger" onclick="deleteVoucher('${v.id}')">Hapus</button></div></div>`).join('')}`}
function voucherEditor(id){let v=id?db.vouchers.find(x=>x.id===id):{code:'',type:'percent',value:10,expires:'2027-12-31',limit:100,used:0};showModal(`<div class="modal"><div class="modal-head"><h3>${id?'Edit':'Tambah'} Voucher</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Kode</label><input id="veCode" value="${esc(v.code)}"></div><div class="field"><label>Tipe</label><select id="veType"><option value="percent" ${v.type==='percent'?'selected':''}>Persen</option><option value="fixed" ${v.type==='fixed'?'selected':''}>Nominal</option></select></div><div class="field"><label>Nilai</label><input id="veValue" type="number" value="${v.value}"></div><div class="field"><label>Masa berlaku</label><input id="veExp" type="date" value="${v.expires}"></div><div class="field"><label>Batas penggunaan</label><input id="veLimit" type="number" value="${v.limit}"></div></div><button class="btn btn-primary" style="margin-top:15px" onclick="saveVoucher('${id||''}')">Simpan</button></div></div>`)}
function saveVoucher(id){let v=id?db.vouchers.find(x=>x.id===id):{id:uid('v'),used:0};v.code=document.getElementById('veCode').value.trim().toUpperCase();v.type=document.getElementById('veType').value;v.value=Number(document.getElementById('veValue').value)||0;v.expires=document.getElementById('veExp').value;v.limit=Math.max(1,Number(document.getElementById('veLimit').value)||1);if(!id)db.vouchers.push(v);saveDB();closeModal();toast('Voucher tersimpan.');renderPageOnly()}
function deleteVoucher(id){if(!confirm('Hapus voucher?'))return;db.vouchers=db.vouchers.filter(v=>v.id!==id);saveDB();renderPageOnly()}
function reportsPage(){let os=db.orders.filter(o=>o.paymentStatus==='Berhasil'),now=new Date(),week=new Date(now-7*86400000),month=new Date(now.getFullYear(),now.getMonth(),1),wk=os.filter(o=>new Date(o.createdAt)>=week),mo=os.filter(o=>new Date(o.createdAt)>=month),revenue=a=>a.reduce((x,o)=>x+o.total,0),countItems=a=>a.reduce((x,o)=>x+o.items.reduce((y,i)=>y+i.qty,0),0),productCounts={};os.forEach(o=>o.items.forEach(i=>productCounts[i.name]=(productCounts[i.name]||0)+i.qty));let top=Object.entries(productCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<h1 class="page-title">📈 Laporan Penjualan</h1><div class="stats"><div class="stat"><strong>${money(revenue(os.filter(o=>new Date(o.createdAt).toDateString()===now.toDateString())))}</strong><span>Hari ini</span></div><div class="stat"><strong>${money(revenue(wk))}</strong><span>7 hari terakhir</span></div><div class="stat"><strong>${money(revenue(mo))}</strong><span>Bulan ini</span></div><div class="stat"><strong>${os.length}</strong><span>Total transaksi</span></div></div><div class="section two-col"><div class="panel"><h3>Produk Terlaris</h3>${top.map((x,i)=>`<div class="between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${i+1}. ${esc(x[0])}</span><b>${x[1]} pcs</b></div>`).join('')||'<p class="muted">Belum ada data.</p>'}</div><div class="panel"><h3>Ringkasan</h3><p>Produk terjual: <b>${countItems(os)}</b></p><p>Antrean: <b>${db.queues.length}</b></p><p>Produk habis: <b>${db.products.filter(p=>stockState(p)==='out').length}</b></p><p>Hampir habis: <b>${db.products.filter(p=>stockState(p)==='low').length}</b></p></div></div><div class="section panel"><h3>Grafik Transaksi 7 Hari</h3><div class="chart">${Array.from({length:7},(_,i)=>{let d=new Date(now);d.setDate(now.getDate()-6+i);let n=os.filter(o=>new Date(o.createdAt).toDateString()===d.toDateString()).length,max=Math.max(1,...Array.from({length:7},(_,j)=>{let dd=new Date(now);dd.setDate(now.getDate()-6+j);return os.filter(o=>new Date(o.createdAt).toDateString()===dd.toDateString()).length}));return `<div class="bar" style="height:${20+n/max*150}px"><span>${d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit'})}</span></div>`}).join('')}</div></div>`}

/* =========================
   AUTH / MODALS / UTILITIES
   ========================= */
function showAuth(mode){document.getElementById('root').innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-brand"><div class="brand-logo"><i class="fa-solid fa-shirt"></i></div><h2>Toko Seragam</h2><div class="muted">${SCHOOL}</div></div><div class="auth-tabs"><button class="${mode==='login'?'active':''}" onclick="showAuth('login')">Login</button><button class="${mode==='signup'?'active':''}" onclick="showAuth('signup')">Sign Up</button></div>${mode==='login'?loginForm():signupForm()}</div></div>`}
function loginForm(){return `<div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="email@contoh.com"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="loginPass" type="password" placeholder="••••••"></div><button class="btn btn-primary" style="width:100%;margin-top:18px" onclick="login()">Login</button><div class="notice" style="margin-top:15px"><b>Akun demo</b><br>Pembeli: pembeli@demo.com / 123456<br>Penjual: admin@demo.com / admin123</div>`}
function signupForm(){return `<div class="field"><label>Jenis akun</label><select id="suRole" onchange="toggleSignup()"><option value="buyer">PEMBELI</option><option value="seller">PENJUAL</option></select></div><div class="field" style="margin-top:12px"><label>Nama</label><input id="suName"></div><div class="field" style="margin-top:12px"><label>Email</label><input id="suEmail" type="email"></div><div class="field" style="margin-top:12px"><label>Nomor HP (pembeli)</label><input id="suPhone"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="suPass" type="password"></div><button class="btn btn-primary" style="width:100%;margin-top:18px" onclick="signup()">Buat Akun</button>`}
function toggleSignup(){}
function login(){const e=document.getElementById('loginEmail').value.trim().toLowerCase(),p=document.getElementById('loginPass').value,u=db.users.find(x=>x.email.toLowerCase()===e&&x.password===p);if(!u)return toast('Email atau password salah.');db.currentUser=u.id;saveDB();state.page=u.role==='buyer'?'home':'sellerHome';render()}
function signup(){const role=document.getElementById('suRole').value,name=document.getElementById('suName').value.trim(),email=document.getElementById('suEmail').value.trim().toLowerCase(),phone=document.getElementById('suPhone').value.trim(),pass=document.getElementById('suPass').value;if(!name||!email||!pass)return toast('Nama, email, dan password wajib diisi.');if(db.users.some(u=>u.email.toLowerCase()===email))return toast('Email sudah digunakan.');const u={id:uid('u'),name,email,password:pass,phone,role};if(role==='buyer')Object.assign(u,{className:'',gender:'',cart:[]});db.users.push(u);db.currentUser=u.id;saveDB();state.page=role==='buyer'?'home':'sellerHome';toast('Akun berhasil dibuat.');render()}
function logout(){db.currentUser=null;saveDB();state={page:'home',search:'',category:'Semua',size:'Semua',sort:'default',checkoutStep:1,checkoutData:null,selectedProduct:null,selectedSize:null,selectedQty:1,appliedVoucher:null};showAuth('login')}
function showModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop show" onclick="if(event.target===this)closeModal()">${html}</div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function readNotification(id){const n=db.notifications.find(x=>x.id===id);if(n)n.read=true;saveDB();renderPageOnly()}
function markNotifications(){db.notifications.filter(n=>n.userId===current().id).forEach(n=>n.read=true);saveDB();renderPageOnly()}
function showReceipt(id){const o=db.orders.find(x=>x.id===id);showModal(`<div class="modal"><div class="modal-head"><h3>🧾 Struk Pembelian</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body" id="receipt"><div class="center"><h2>Toko Seragam</h2><b>${SCHOOL}</b><p class="small">${formatDate(o.createdAt)}</p></div><hr><p>No. Pesanan: <b>${o.orderNo}</b><br>Nama: ${esc(o.buyer.name)}<br>Kelas: ${esc(o.buyer.className)}<br>Pembayaran: ${o.payment}<br>Antrean: <b>${o.queueNo}</b><br>Pengambilan: <b>${pickupInfo(o.queueNo)?.label||'-'} sekitar ${pickupInfo(o.queueNo)?.time||'-'}</b></p>${o.items.map(i=>`<div class="summary-row"><span>${esc(i.name)} (${i.size}) × ${i.qty}</span><b>${money(i.subtotal)}</b></div>`).join('')}<div class="summary-row"><span>Voucher</span><b>-${money(o.discount)}</b></div><div class="summary-row total"><span>Total</span><b>${money(o.total)}</b></div><button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="printReceipt()">🖨️ Cetak Struk</button></div></div>`)}
function printReceipt(){const html=document.getElementById('receipt').innerHTML,win=window.open('','_blank');if(!win)return toast('Popup diblokir browser.');win.document.write(`<html><head><title>Struk ${SCHOOL}</title><style>body{font-family:Arial;max-width:500px;margin:30px auto} .summary-row{display:flex;justify-content:space-between;padding:7px 0}.total{border-top:1px solid #ddd;font-weight:bold}</style></head><body>${html}</body></html>`);win.document.close();win.print()}
function resetDemo(){if(!confirm('Apakah Anda yakin ingin menghapus data transaksi dan mengembalikan aplikasi ke kondisi demo awal?'))return;const seller=db.users.find(u=>u.id===current().id);const d=initialDB();d.users=d.users.filter(u=>u.email!=='admin@demo.com');d.users.push(seller);d.currentUser=seller.id;saveDB(d);db=d;state={page:'sellerHome'};toast('Data demo berhasil direset.');render()}

/* init */
render();
</script>
</body>
</html>
