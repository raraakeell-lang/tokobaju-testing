<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--primary:#234e70;--primary2:#356d99;--accent:#d4a017;--green:#2f855a;--red:#c53030;--bg:#f5f7fa;--card:#fff;--text:#263238;--muted:#6b7280;--line:#e5e7eb;--shadow:0 8px 25px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-weight:800;color:var(--primary);font-size:20px;white-space:nowrap}.search{flex:1;max-width:620px;position:relative}.search input{width:100%;padding:11px 15px 11px 40px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.search i{position:absolute;left:14px;top:12px;color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.icon-btn{background:#f8fafc;border:1px solid var(--line);width:40px;height:40px;border-radius:11px;color:var(--primary);position:relative}.badge-dot{position:absolute;right:-2px;top:-2px;background:var(--red);color:white;border-radius:20px;font-size:10px;padding:2px 5px}.layout{display:flex;min-height:calc(100vh - 68px)}.sidebar{width:235px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;flex-shrink:0}.side-title{font-size:11px;color:#9ca3af;text-transform:uppercase;margin:12px 10px 8px}.nav-btn{width:100%;text-align:left;padding:11px 12px;border-radius:10px;background:transparent;color:#4b5563;margin:2px 0}.nav-btn:hover,.nav-btn.active{background:#edf4f9;color:var(--primary);font-weight:700}.nav-btn i{width:24px}.content{flex:1;padding:25px;max-width:1500px;margin:auto;width:100%}.page-title{font-size:26px;margin:0 0 5px}.muted{color:var(--muted)}.banner{background:linear-gradient(110deg,var(--primary),#447ca4);color:white;border-radius:18px;padding:25px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:var(--shadow);margin-bottom:20px}.banner h2{margin:0 0 7px}.btn{padding:10px 14px;border-radius:10px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--primary)}.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-success{background:var(--green);color:#fff;border-color:var(--green)}.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}.btn-warning{background:#fff6db;color:#8a6500;border-color:#f0d477}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat .num{font-size:25px;font-weight:800;margin-top:5px}.section{margin:25px 0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section h3{margin:0}.product-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.product-card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}.product-img{width:100%;height:155px;object-fit:cover;background:#eef2f5}.product-body{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1}.product-title{font-weight:750}.price{font-weight:800;color:var(--primary)}.small{font-size:12px}.stock{font-size:12px;font-weight:700}.stock.ok{color:var(--green)}.stock.low{color:#a16207}.stock.out{color:var(--red)}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:20px;background:#edf4f9;color:var(--primary);font-size:11px;font-weight:700}.product-actions{display:flex;gap:8px;margin-top:auto}.product-actions .btn{flex:1}.school-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.school-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}.school-card:hover{border-color:var(--primary)}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}.filters input,.filters select,.form input,.form select,.form textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}.filters>*{min-width:150px;flex:1}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}.table th{color:#6b7280;font-weight:700}.order-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.order-items{display:grid;gap:9px;margin:12px 0}.order-item{display:flex;gap:10px;align-items:center}.order-item img{width:55px;height:55px;border-radius:9px;object-fit:cover}.status{display:inline-flex;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800;background:#eef2f5}.status.success{background:#e8f7ef;color:#26714b}.status.warn{background:#fff5d9;color:#916a00}.status.danger{background:#fdecec;color:#a72d2d}.queue-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;text-align:center;box-shadow:var(--shadow)}.queue-number{font-size:54px;font-weight:900;color:var(--primary);letter-spacing:2px}.queue-big{font-size:28px;font-weight:800}.queue-list{display:grid;gap:9px}.queue-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.empty{text-align:center;padding:45px 20px;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:15px}.empty i{font-size:32px;margin-bottom:10px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-box{background:#fff;border-radius:17px;max-width:700px;width:100%;max-height:92vh;overflow:auto;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#f1f5f9;border-radius:9px;width:35px;height:35px}.detail-img{width:100%;height:260px;object-fit:cover;border-radius:13px;background:#eef2f5}.form{display:grid;gap:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.size-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}.size-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:left}.size-btn.selected{border:2px solid var(--primary);background:#edf4f9}.toast{position:fixed;right:18px;bottom:18px;background:#263238;color:#fff;padding:12px 16px;border-radius:10px;z-index:100;box-shadow:var(--shadow);max-width:340px}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#edf4f9,#f8fafc)}.auth-box{width:100%;max-width:450px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(15,23,42,.1)}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:18px;background:#f1f5f9;border-radius:10px;padding:4px}.auth-tabs button{padding:9px;border-radius:8px;background:transparent}.auth-tabs .active{background:#fff;color:var(--primary);font-weight:800}.checkout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.summary-row{display:flex;justify-content:space-between;padding:7px 0}.total{font-size:20px;font-weight:900;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}.mobile-nav{display:none}.avatar{width:42px;height:42px;border-radius:50%;background:#edf4f9;color:var(--primary);display:grid;place-items:center;font-weight:800}.mini-actions{display:flex;gap:6px;flex-wrap:wrap}.notice{padding:12px;border-radius:10px;background:#fff8e6;border:1px solid #f0d477;color:#775900}.chart{height:180px;display:flex;align-items:end;gap:10px;padding-top:20px}.bar{flex:1;background:var(--primary2);border-radius:6px 6px 0 0;min-height:4px;position:relative}.bar span{position:absolute;top:-20px;font-size:10px;width:100%;text-align:center}.qr{width:130px;height:130px;border:8px solid #fff;box-shadow:0 0 0 1px #ddd;margin:12px auto;display:block}.login-switch{margin-top:15px;text-align:center;font-size:13px}.link{color:var(--primary);font-weight:700;cursor:pointer}.bottom-nav{display:none}
@media(max-width:900px){.sidebar{display:none}.content{padding:17px;padding-bottom:85px}.stats{grid-template-columns:1fr 1fr}.checkout{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:7px}.mobile-nav button{background:none;color:#64748b;font-size:11px}.mobile-nav i{display:block;font-size:18px;margin-bottom:2px}.mobile-nav button.active{color:var(--primary);font-weight:800}.topbar{padding:0 12px}.search{display:none}.brand{font-size:17px}.banner{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-img{height:125px}.product-body{padding:10px}.product-title{font-size:13px}.price{font-size:13px}.content{padding:13px;padding-bottom:85px}.page-title{font-size:21px}.modal{padding:8px}.modal-box{padding:15px}.queue-number{font-size:43px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastRoot"></div>

<script>
/* ===================== DATA & STORAGE ===================== */
const LS = {
  users:'ss_users', current:'ss_currentUser', products:'ss_products', carts:'ss_carts',
  orders:'ss_orders', queues:'ss_queues', vouchers:'ss_vouchers', wishlist:'ss_wishlist',
  notifications:'ss_notifications', restock:'ss_restock', settings:'ss_settings'
};
const schoolGroups={
 SD:Array.from({length:56},(_,i)=>`SD${String(i+1).padStart(2,'0')}PADANG`),
 SMP:Array.from({length:42},(_,i)=>`SMP${String(i+1).padStart(2,'0')}PADANG`),
 SMA:Array.from({length:17},(_,i)=>`SMA${String(i+1).padStart(2,'0')}PADANG`)
};
const demoUsers=[
 {id:'u-demo-buyer',name:'Pembeli Demo',phone:'081234567890',email:'pembeli@demo.com',password:'123456',role:'buyer',gender:'cowok',level:'SMA',school:'SMA01PADANG'},
 {id:'u-demo-admin',name:'Admin Demo',email:'admin@demo.com',password:'admin123',role:'seller'}
];
const productNames={
 SD:['Baju Putih SD','Celana Merah SD','Baju Olahraga SD','Topi SD','Paket Seragam SD'],
 SMP:['Baju Putih SMP','Celana Biru SMP','Baju Olahraga SMP','Dasi SMP','Paket Seragam SMP'],
 SMA:['Baju Putih SMA','Celana Abu SMA','Baju Olahraga SMA','Dasi SMA','Paket Seragam SMA']
};
const cats=['Baju','Celana','Rok','Baju olahraga','Jaket','Dasi','Topi','Atribut','Paket seragam'];
const sizes=['S','M','L','XL','XXL'];

function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}}
function uid(prefix='id'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function money(n){return 'Rp'+Number(n||0).toLocaleString('id-ID')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function imgData(label,level='') {
  const colors={SD:'#e7eef5',SMP:'#edf1e7',SMA:'#f2eee7'};
  const c=colors[level]||'#edf2f7';
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500"><rect width="100%" height="100%" fill="${c}"/><circle cx="350" cy="145" r="62" fill="#d6b89c"/><path d="M245 270 Q350 220 455 270 L500 455 H200Z" fill="#fff" stroke="#234e70" stroke-width="8"/><path d="M305 260 L350 330 395 260" fill="none" stroke="#234e70" stroke-width="7"/><path d="M235 280 L165 430 M465 280 L535 430" stroke="#234e70" stroke-width="18"/><path d="M245 440 H455" stroke="#777" stroke-width="35"/><text x="350" y="70" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#234e70">${label}</text><text x="350" y="485" text-anchor="middle" font-family="Arial" font-size="18" fill="#555">ILUSTRASI PRODUK</text></svg>`);
}
function initialProducts(){
  const arr=[]; let no=1;
  ['SD','SMP','SMA'].forEach(level=>{
    productNames[level].forEach((name,i)=>{
      const school=schoolGroups[level][i%Math.min(3,schoolGroups[level].length)];
      const cat=i===0?'Baju':i===1?(level==='SMA'?'Celana':'Celana'):i===2?'Baju olahraga':i===3?(level==='SD'?'Topi':'Dasi'):'Paket seragam';
      const base=level==='SD'?70000:level==='SMP'?85000:100000;
      const prices={S:base,M:base+5000,L:base+10000,XL:base+15000,XXL:base+25000};
      const stocks={S:8+i,M:10+i,L:7+i,XL:5+i,XXL:i===4?0:3+i};
      arr.push({id:'P'+String(no++).padStart(3,'0'),name,school,level,category:cat,
        description:`${name} berkualitas untuk kebutuhan sekolah. Cocok untuk aktivitas belajar dan kegiatan sekolah.`,image:imgData(name,level),
        variants:sizes.map(s=>({size:s,price:prices[s],stock:stocks[s]})),createdAt:Date.now()+i});
    });
  });
  return arr;
}
function resetDemo(){
  save(LS.users,demoUsers); save(LS.products,initialProducts()); save(LS.carts,{}); save(LS.orders,[]);
  save(LS.queues,[]); save(LS.vouchers,[
    {id:'v1',code:'SERAGAM10',type:'percent',value:10,expires:'2030-12-31',limit:100,used:0},
    {id:'v2',code:'HEMAT20',type:'fixed',value:20000,expires:'2030-12-31',limit:100,used:0},
    {id:'v3',code:'WELCOME',type:'percent',value:5,expires:'2030-12-31',limit:100,used:0}
  ]);
  save(LS.wishlist,{}); save(LS.notifications,[]); save(LS.restock,[]); save(LS.settings,{currentQueue:0,nextQueue:1});
}
if(!localStorage.getItem(LS.products)) resetDemo();
let currentUser=load(LS.current,null); if(currentUser&&currentUser.email==='pembeli@demo.com'&&!currentUser.gender){currentUser={...currentUser,gender:'cowok'};save(LS.current,currentUser)}
let page='home', modal=null, authMode='login', selectedSchool='', productFilter='';
let cart=()=>{const all=load(LS.carts,{}); return all[currentUser?.id]||[]};
function setCart(items){const all=load(LS.carts,{}); all[currentUser.id]=items; save(LS.carts,all)}
function users(){return load(LS.users,demoUsers)}
function products(){return load(LS.products,[])}
function orders(){return load(LS.orders,[])}
function queues(){return load(LS.queues,[])}
function addNotification(userId,text,type='info'){const n=load(LS.notifications,[]);n.unshift({id:uid('n'),userId,text,type,read:false,time:new Date().toISOString()});save(LS.notifications,n)}
function userNotifications(){return load(LS.notifications,[]).filter(n=>n.userId===currentUser?.id)}
function wishlist(){const w=load(LS.wishlist,{});return w[currentUser?.id]||[]}
function setWishlist(ids){const w=load(LS.wishlist,{});w[currentUser.id]=ids;save(LS.wishlist,w)}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',3000)}
function roleGuard(role){if(!currentUser||currentUser.role!==role){toast('Akses ditolak.');page=currentUser?.role==='seller'?'admin':'home';render();return false}return true}
function logout(){localStorage.removeItem(LS.current);currentUser=null;page='home';render()} function forceLogout(){currentUser=null;localStorage.removeItem(LS.current);page='home';authMode='login';renderAuth()}

/* ===================== AUTH ===================== */
function renderAuth(){
 document.getElementById('app').innerHTML=`<div class="auth"><div class="auth-box">
  <div style="text-align:center;margin-bottom:20px"><div class="brand" style="font-size:28px">SeragamKu</div><div class="muted">Toko seragam sekolah SD • SMP • SMA</div></div>
  <div class="auth-tabs"><button class="${authMode==='login'?'active':''}" onclick="authMode='login';renderAuth()">Login</button><button class="${authMode==='signup'?'active':''}" onclick="authMode='signup';renderAuth()">Sign Up</button></div>
  <div id="authForm"></div>
 </div></div>`;
 const f=document.getElementById('authForm');
 if(authMode==='login') f.innerHTML=`<form class="form" onsubmit="doLogin(event)">
  <label>Email<input id="loginEmail" type="email" required placeholder="nama@email.com"></label>
  <label>Password<input id="loginPass" type="password" required placeholder="••••••••"></label>
  <button class="btn btn-primary">Masuk</button>
  <div class="notice small">Demo pembeli: pembeli@demo.com / 123456<br>Demo penjual: admin@demo.com / admin123</div>
 </form>`;
 else f.innerHTML=`<form class="form" onsubmit="doSignup(event)">
  <label>Nama lengkap<input id="suName" required></label><label>Nomor HP<input id="suPhone" required></label><label>Email<input id="suEmail" type="email" required></label><label>Password<input id="suPass" type="password" minlength="6" required></label>
  <div class="form-grid"><label>Jenjang<select id="suLevel" required onchange="fillSignupSchools()"><option value="">Pilih</option><option>SD</option><option>SMP</option><option>SMA</option></select></label><label>Sekolah<select id="suSchool" required><option value="">Pilih jenjang dahulu</option></select></label></div><label>Tipe seragam<select id="suGender" required><option value="cowok">Cowok</option><option value="cewek">Cewek</option></select></label>
  <button class="btn btn-primary">Buat Akun Pembeli</button></form>`;
}
function fillSignupSchools(){const l=document.getElementById('suLevel').value;const s=document.getElementById('suSchool');s.innerHTML=(schoolGroups[l]||[]).map(x=>`<option>${x}</option>`).join('')}
function doLogin(e){e.preventDefault();const email=loginEmail.value.trim().toLowerCase(),pass=loginPass.value;const u=users().find(x=>x.email.toLowerCase()===email&&x.password===pass);if(!u){toast('Email atau password salah.');return}currentUser=u;save(LS.current,u);page=u.role==='seller'?'admin':'home';render()}
function doSignup(e){e.preventDefault();let us=users();const email=suEmail.value.trim().toLowerCase();if(us.some(x=>x.email.toLowerCase()===email)){toast('Email sudah digunakan.');return}const u={id:uid('u'),name:suName.value.trim(),phone:suPhone.value.trim(),email,password:suPass.value,role:'buyer',gender:suGender.value,level:suLevel.value,school:suSchool.value};us.push(u);save(LS.users,us);currentUser=u;save(LS.current,u);addNotification(u.id,'Akun berhasil dibuat. Selamat datang!');page='home';render()}

/* ===================== SHELL ===================== */
const buyerNav=[['home','fa-house','Beranda'],['school','fa-school','Sekolah'],['products','fa-shirt','Produk'],['cart','fa-cart-shopping','Keranjang'],['queue','fa-ticket','Antrean'],['orders','fa-box','Pesanan'],['history','fa-clock-rotate-left','History'],['wishlist','fa-heart','Wishlist'],['profile','fa-user','Profil']];
const sellerNav=[['admin','fa-chart-line','Dashboard'],['adminOrders','fa-boxes-stacked','Pesanan'],['adminQueue','fa-list-ol','Antrean'],['adminProducts','fa-shirt','Produk'],['adminStock','fa-warehouse','Stok'],['adminVoucher','fa-ticket','Voucher'],['adminReport','fa-chart-column','Laporan'],['adminUsers','fa-users','Pengguna'],['adminSettings','fa-gear','Pengaturan']];
function shell(content){
 const nav=currentUser.role==='seller'?sellerNav:buyerNav;
 const unread=userNotifications().filter(n=>!n.read).length;
 document.getElementById('app').innerHTML=`<div class="app">
 <header class="topbar"><div class="brand">SeragamKu</div>${currentUser.role==='buyer'?`<div class="search"><i class="fa-solid fa-magnifying-glass"></i><input placeholder="Cari seragam, sekolah..." value="${esc(productFilter)}" oninput="productFilter=this.value; if(page==='products') render()"></div>`:''}<div class="top-actions"><button class="icon-btn" onclick="page='notifications';render()"><i class="fa-regular fa-bell"></i>${unread?`<span class="badge-dot">${unread}</span>`:''}</button><div class="avatar">${esc((currentUser.name||'A')[0].toUpperCase())}</div></div></header>
 <div class="layout"><aside class="sidebar"><div class="muted small" style="padding:0 10px 10px">${currentUser.role==='seller'?'PANEL PENJUAL':'PANEL PEMBELI'}</div>${nav.map(n=>`<button class="nav-btn ${page===n[0]?'active':''}" onclick="page='${n[0]}';render()"><i class="fa-solid ${n[1]}"></i>${n[2]}${n[0]==='cart'&&cart().length?` <span class="tag">${cart().length}</span>`:''}</button>`).join('')}<div style="margin-top:20px;border-top:1px solid var(--line);padding-top:10px"><button class="nav-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>Logout</button></div></aside><main class="content">${content}</main></div>
 <nav class="mobile-nav">${(currentUser.role==='seller'?sellerNav.slice(0,5):[['home','fa-house','Beranda'],['products','fa-shirt','Produk'],['cart','fa-cart-shopping','Keranjang'],['queue','fa-ticket','Antrean'],['profile','fa-user','Profil']]).map(n=>`<button class="${page===n[0]?'active':''}" onclick="page='${n[0]}';render()"><i class="fa-solid ${n[1]}"></i>${n[2]}</button>`).join('')}</nav></div>`;
}
function render(){if(!currentUser){renderAuth();return} if(currentUser.role==='buyer')renderBuyer();else renderSeller()}

/* ===================== BUYER ===================== */
function renderBuyer(){
 let c='';
 if(page==='home')c=buyerHome();
 else if(page==='school')c=schoolPage();
 else if(page==='products')c=catalog();
 else if(page==='cart')c=cartPage();
 else if(page==='queue')c=queuePage();
 else if(page==='orders')c=ordersPage(false);
 else if(page==='history')c=ordersPage(true);
 else if(page==='wishlist')c=wishlistPage();
 else if(page==='profile')c=profilePage();
 else if(page==='notifications')c=notificationsPage();
 else if(page==='checkout')c=checkoutPage();
 shell(c);
}
function buyerHome(){
 const ps=products();const school=currentUser.school;

function renderProductList(){

 arr=arr.filter(p=>{if(!sf)return true;return p.variants.some(v=>v.size===sf&&(st==='out'?v.stock===0:v.stock>0))});
 arr=arr.filter(p=>{const total=p.variants.reduce((a,v)=>a+v.stock,0);if(st==='available')return total>0;if(st==='low')return total>0&&total<=15;if(st==='out')return total===0;return true});

function productCard(p){
 const available=p.variants.filter(v=>v.stock>0);const min=available.length?Math.min(...available.map(v=>v.price)):Math.min(...p.variants.map(v=>v.price));const total=p.variants.reduce((a,v)=>a+v.stock,0);

}

 document.getElementById('modalRoot')?.remove();document.body.appendChild(root);

function closeModal(){modal=null;document.getElementById('modalRoot')?.remove()}
function addToCart(pid,size,qty){
 const p=products().find(x=>x.id===pid),v=p?.variants.find(x=>x.size===size);qty=Number(qty);
 if(!v||v.stock<=0){toast('Stok habis.');return}const c=cart(),existing=c.find(x=>x.productId===pid&&x.size===size);const newQty=(existing?.qty||0)+qty;
 if(newQty>v.stock){toast(`Stok hanya tersedia ${v.stock}.`);return}
 if(existing)existing.qty=newQty;else c.push({id:uid('ci'),productId:pid,size,qty});setCart(c);toast('Produk masuk ke keranjang.');render()
}
function updateCart(id,delta){const c=cart();const it=c.find(x=>x.id===id);if(!it)return;const p=products().find(x=>x.id===it.productId),v=p?.variants.find(x=>x.size===it.size);const q=it.qty+delta;if(q<=0){setCart(c.filter(x=>x.id!==id));render();return}if(q>v.stock){toast(`Stok hanya tersedia ${v.stock}.`);return}it.qty=q;setCart(c);render()}
function removeCart(id){setCart(cart().filter(x=>x.id!==id));render()}
function cartPage(){
 const c=cart();if(!c.length)return `<h1 class="page-title">Keranjang</h1>${empty('fa-cart-shopping','Keranjang masih kosong')}`;
 const items=c.map(it=>{const p=products().find(x=>x.id===it.productId),v=p?.variants.find(x=>x.size===it.size);return p&&v?{it,p,v,sub:v.price*it.qty}:null}).filter(Boolean);const sub=items.reduce((a,x)=>a+x.sub,0);
 return `<h1 class="page-title">Keranjang</h1><p class="muted">${items.length} item</p><div class="checkout"><div>${items.map(x=>`<div class="order-card"><div class="order-item"><img src="${x.p.image}"><div style="flex:1"><b>${esc(x.p.name)}</b><div class="muted small">${esc(x.p.school)} • Size ${x.v.size}</div><div class="price">${money(x.v.price)}</div></div><div class="mini-actions"><button class="btn" onclick="updateCart('${x.it.id}',-1)">−</button><b style="padding:10px">${x.it.qty}</b><button class="btn" onclick="updateCart('${x.it.id}',1)">+</button><button class="btn btn-danger" onclick="removeCart('${x.it.id}')">Hapus</button></div></div><div style="text-align:right;font-weight:800">Subtotal ${money(x.sub)}</div></div>`).join('')}</div><div class="panel"><h3>Ringkasan</h3><div class="summary-row"><span>Subtotal</span><b>${money(sub)}</b></div><button class="btn btn-primary" style="width:100%" onclick="page='checkout';render()">Lanjut Checkout</button></div></div>`;
}
function checkoutPage(){
 const c=cart();if(!c.length){page='cart';return cartPage()}const items=c.map(it=>{const p=products().find(x=>x.id===it.productId),v=p?.variants.find(x=>x.size===it.size);return p&&v?{it,p,v,sub:v.price*it.qty}:null}).filter(Boolean);const sub=items.reduce((a,x)=>a+x.sub,0);
 return `<h1 class="page-title">Periksa Pesanan Anda</h1><p class="muted">Pastikan ukuran, jumlah, dan metode pembayaran sudah benar.</p><div class="checkout"><div class="panel"><h3>Produk</h3>${items.map(x=>`<div class="order-item" style="margin:12px 0"><img src="${x.p.image}"><div style="flex:1"><b>${esc(x.p.name)}</b><div class="muted small">${x.v.size} × ${x.it.qty} • ${money(x.v.price)}/item</div></div><b>${money(x.sub)}</b></div>`).join('')}</div><div class="panel"><h3>Pembayaran</h3><label class="small">Kode voucher</label><div style="display:flex;gap:8px;margin:6px 0 12px"><input id="voucherCode" placeholder="SERAGAM10" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:10px"><button class="btn" onclick="applyCheckoutVoucher(${sub})">Pakai</button></div><div id="voucherInfo" class="small muted"></div><div class="summary-row"><span>Subtotal</span><b>${money(sub)}</b></div><div class="summary-row"><span>Diskon</span><b id="checkoutDiscount">Rp0</b></div><div class="total summary-row"><span>Total</span><b id="checkoutTotal">${money(sub)}</b></div><h4>Metode pembayaran</h4><select id="paymentMethod" class="form"><option value="cod">Bayar di tempat</option><option value="qris">QRIS (simulasi)</option><option value="bank">Transfer Bank (simulasi)</option><option value="ewallet">E-Wallet (simulasi)</option></select><button class="btn btn-primary" style="width:100%;margin-top:15px" onclick="placeOrder(${sub})">Konfirmasi Pesanan</button></div></div>`;
}
let checkoutDiscount=0,checkoutVoucher=null;
function applyCheckoutVoucher(sub){
 const code=document.getElementById('voucherCode').value.trim().toUpperCase();const v=load(LS.vouchers,[]).find(x=>x.code===code);const today=new Date().toISOString().slice(0,10);
 if(!v){checkoutDiscount=0;checkoutVoucher=null;toast('Voucher tidak valid.');return}if(v.expires<today){toast('Voucher kedaluwarsa.');return}if(v.limit>0&&v.used>=v.limit){toast('Batas penggunaan voucher sudah tercapai.');return}
 checkoutVoucher=v;checkoutDiscount=v.type==='percent'?Math.floor(sub*v.value/100):Math.min(v.value,sub);document.getElementById('voucherInfo').textContent=`Voucher ${v.code} aktif.`;document.getElementById('checkoutDiscount').textContent='-'+money(checkoutDiscount);document.getElementById('checkoutTotal').textContent=money(sub-checkoutDiscount)
}
function placeOrder(sub){
 const c=cart();if(!c.length){toast('Keranjang kosong.');return}const ps=products();const items=[];
 for(const it of c){const p=ps.find(x=>x.id===it.productId),v=p?.variants.find(x=>x.size===it.size);if(!p||!v)continue;if(v.stock<it.qty){toast(`Stok ${p.name} ukuran ${it.size} hanya ${v.stock}.`);return}items.push({productId:p.id,name:p.name,image:p.image,school:p.school,size:it.size,qty:it.qty,price:v.price,subtotal:v.price*it.qty})}
 if(!items.length)return;const total=sub-checkoutDiscount;const settings=load(LS.settings,{currentQueue:0,nextQueue:1});const qNum='A-'+String(settings.nextQueue++).padStart(3,'0');save(LS.settings,settings);
 ps.forEach(p=>{const its=items.filter(x=>x.productId===p.id);its.forEach(it=>{const v=p.variants.find(x=>x.size===it.size);v.stock-=it.qty})});save(LS.products,ps);
 const method=document.getElementById('paymentMethod').value;const status=method==='cod'?'Bayar di tempat':'Menunggu pembayaran';const o={id:uid('ORD'),number:'ORD-'+String(Date.now()).slice(-4),userId:currentUser.id,userName:currentUser.name,items,subtotal:sub,discount:checkoutDiscount,voucher:checkoutVoucher?.code||null,total,payment:method,paymentStatus:method==='cod'?'Bayar di tempat':'Menunggu pembayaran',status:'Menunggu',queueNumber:qNum,date:new Date().toISOString()};
 save(LS.orders,[o,...orders()]);save(LS.carts,{...load(LS.carts,{}),[currentUser.id]:[]});
 const qs=queues();qs.push({id:uid('q'),number:qNum,orderId:o.id,userId:currentUser.id,userName:currentUser.name,status:'Menunggu',createdAt:o.date});save(LS.queues,qs);
 if(checkoutVoucher){const vs=load(LS.vouchers,[]);const vv=vs.find(v=>v.code===checkoutVoucher.code);if(vv)vv.used++;save(LS.vouchers,vs)}
 addNotification(currentUser.id,`Pesanan ${o.number} diterima. Nomor antrean Anda ${qNum}.`);
 addNotification('seller',`Pesanan baru ${o.number} dari ${currentUser.name}.`,'order');
 checkoutDiscount=0;checkoutVoucher=null;
 if(method==='qris'){showQrisPayment(o.id)}else{page='orders';render();toast('Pesanan berhasil dibuat.')}
}
function showQrisPayment(orderId){
 const o=orders().find(x=>x.id===orderId);if(!o)return;
 const root=document.createElement('div');root.id='modalRoot';root.className='modal';
 root.innerHTML=`<div class="modal-box" style="max-width:430px;text-align:center"><div class="modal-head"><h3>💳 Pembayaran QRIS</h3><button class="close" onclick="closeModal()">×</button></div><p class="muted small">SIMULASI — tidak melakukan pembayaran sungguhan</p><div style="font-size:13px;margin:10px 0"><b>${esc(o.number)}</b><br>Total <b>${money(o.total)}</b></div><canvas id="paymentQr" class="qr" width="180" height="180" style="width:180px;height:180px"></canvas><div class="notice small">QR pembayaran ini adalah simulasi lokal.</div><div class="mini-actions" style="justify-content:center;margin-top:12px"><button class="btn btn-success" onclick="simulateQrisPaid('${o.id}')">✓ Simulasikan Pembayaran Berhasil</button><button class="btn" onclick="closeModal();page='orders';render()">Nanti</button></div></div>`;
 document.body.appendChild(root);drawPaymentQR(o);
}
function drawPaymentQR(o){const c=document.getElementById('paymentQr');if(!c)return;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';let seed=0;for(const ch of (o.number+o.id+o.total))seed=(seed+ch.charCodeAt(0)*31)%100000;const n=29,cell=6;function finder(r,c0){for(let y=0;y<7;y++)for(let xx=0;xx<7;xx++){const edge=y===0||y===6||xx===0||xx===6,mid=y>=2&&y<=4&&xx>=2&&xx<=4;if(edge||mid)x.fillRect(5+(c0+xx)*cell,5+(r+y)*cell,cell,cell)}}finder(0,0);finder(0,22);finder(22,0);for(let r=0;r<n;r++)for(let col=0;col<n;col++){if((r<8&&col<8)||(r<8&&col>20)||(r>20&&col<8))continue;if(((seed+r*43+col*17+r*col*7)%11)<5)x.fillRect(5+col*cell,5+r*cell,cell,cell)}}
function simulateQrisPaid(orderId){const os=orders();const o=os.find(x=>x.id===orderId);if(!o)return;o.paymentStatus='Dibayar';o.status='Diproses';o.paidAt=new Date().toISOString();save(LS.orders,os);addNotification(o.userId,`Pembayaran ${o.number} berhasil. Pesanan sedang diproses.`,'payment');addNotification('seller',`Pembayaran masuk untuk ${o.number}.`,'payment');closeModal();page='orders';render();toast('Pembayaran QRIS simulasi berhasil.')}
function ordersPage(history=false){

 return `<h1 class="page-title">${history?'Riwayat Pembelian':'Pesanan Saya'}</h1><div class="filters"><select onchange="orderStatusFilter=this.value;render()"><option value="">Semua</option><option>Menunggu</option><option>Diproses</option><option>Siap Diambil</option><option>Selesai</option><option>Dibatalkan</option></select></div>${arr.filter(o=>!orderStatusFilter||o.status===orderStatusFilter).map(o=>orderCard(o,history)).join('')}`;

let orderStatusFilter='';
function orderCard(o,history){

function buyAgain(orderId){const o=orders().find(x=>x.id===orderId);let added=0;for(const i of o.items){const p=products().find(x=>x.id===i.productId),v=p?.variants.find(x=>x.size===i.size);if(!v||v.stock<=0){toast(`${i.name} ukuran ${i.size} sudah habis.`);continue}const qty=Math.min(i.qty,v.stock);addToCart(i.productId,i.size,qty);added++}if(added){page='cart';render();}}
function queuePage(){
 const qs=queues();const mine=qs.filter(q=>q.userId===currentUser.id&&!['Selesai','Dilewati'].includes(q.status)).sort((a,b)=>a.createdAt.localeCompare(b.createdAt))[0];const setting=load(LS.settings,{currentQueue:0,nextQueue:1});const current=setting.currentQueue||0;
 if(!mine)return `<h1 class="page-title">Antrean Saya</h1>${empty('fa-ticket','Belum memiliki antrean')}`;
 const num=parseInt(mine.number.slice(2));const ahead=qs.filter(q=>q.status==='Menunggu'&&parseInt(q.number.slice(2))<num).length;const mins=ahead*4;
 return `<h1 class="page-title">Antrean Saya</h1><div class="queue-box"><div class="muted">Nomor Anda</div><div class="queue-number">${mine.number}</div><div class="muted">Sedang dilayani</div><div class="queue-big">A-${String(current).padStart(3,'0')}</div><div class="grid stats" style="margin-top:18px"><div class="stat"><div class="muted small">Di depan Anda</div><div class="num">${ahead}</div></div><div class="stat"><div class="muted small">Estimasi</div><div class="num">±${mins} mnt</div></div></div><span class="status ${mine.status==='Dipanggil'?'success':'warn'}">${mine.status}</span><canvas id="qrCanvas" class="qr" width="130" height="130"></canvas><div><button class="btn" onclick="showQueueQR('${mine.id}')">🔳 Perbesar QR Antrean</button></div><div class="small muted">QR simulasi • Pesanan: ${esc(mine.orderId)} • ${esc(currentUser.name)}</div></div>`;
}
function showQueueQR(queueId){const q=queues().find(x=>x.id===queueId);if(!q)return;const root=document.createElement('div');root.id='modalRoot';root.className='modal';root.innerHTML=`<div class="modal-box" style="max-width:400px;text-align:center"><div class="modal-head"><h3>🎫 QR Antrean</h3><button class="close" onclick="closeModal()">×</button></div><div class="queue-number" style="font-size:38px">${q.number}</div><canvas id="queueQrBig" class="qr" width="210" height="210" style="width:210px;height:210px"></canvas><b>${esc(currentUser.name)}</b><div class="muted small">Pesanan ${esc(q.orderId)}</div><p class="muted small">QR ini adalah simulasi lokal untuk identifikasi antrean.</p><button class="btn btn-primary" onclick="closeModal()">Tutup</button></div>`;document.body.appendChild(root);drawQueueBig(q)}
function drawQueueBig(q){const c=document.getElementById('queueQrBig');if(!c)return;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,210,210);x.fillStyle='#111';let seed=0;for(const ch of (q.number+q.orderId+currentUser.name))seed=(seed+ch.charCodeAt(0)*29)%100000;const n=29,cell=7;function finder(r,c0){for(let y=0;y<7;y++)for(let xx=0;xx<7;xx++){const edge=y===0||y===6||xx===0||xx===6,mid=y>=2&&y<=4&&xx>=2&&xx<=4;if(edge||mid)x.fillRect(5+(c0+xx)*cell,5+(r+y)*cell,cell,cell)}}finder(0,0);finder(0,22);finder(22,0);for(let r=0;r<n;r++)for(let col=0;col<n;col++){if((r<8&&col<8)||(r<8&&col>20)||(r>20&&col<8))continue;if(((seed+r*31+col*23+r*col)%13)<6)x.fillRect(5+col*cell,5+r*cell,cell,cell)}}
function drawQR(){const c=document.getElementById('qrCanvas');const mine=queues().find(q=>q.userId===currentUser.id&&!['Selesai','Dilewati'].includes(q.status));if(!c||!mine)return;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,130,130);x.fillStyle='#111';let seed=0;for(const ch of (mine.number+mine.orderId+currentUser.name))seed=(seed+ch.charCodeAt(0)*17)%100000;for(let r=0;r<21;r++)for(let col=0;col<21;col++){const on=((seed+r*37+col*19+r*col)%7)<3;if(on)x.fillRect(5+col*6,5+r*6,5,5)}}
function wishlistPage(){const ids=wishlist();const arr=products().filter(p=>ids.includes(p.id));return `<h1 class="page-title">Wishlist</h1>${arr.length?`<div class="grid product-grid">${arr.map(productCard).join('')}</div>`:empty('fa-heart','Belum ada wishlist')}`}

function adminOrders(){const os=orders();return `<div class="section-head"><div><h1 class="page-title">Pesanan Masuk</h1><div class="muted">Pesanan terbaru diurutkan berdasarkan antrean.</div></div></div>${os.length?os.map(adminOrderCard).join(''):empty('fa-box','Belum ada pesanan')}`}

function adminQueue(){const qs=queues().slice().sort((a,b)=>parseInt(a.number.slice(2))-parseInt(b.number.slice(2)));const active=qs.filter(q=>!['Selesai','Dilewati'].includes(q.status));return `<div class="section-head"><div><h1 class="page-title">Manajemen Antrean</h1><div class="muted">Kelola panggilan antrean toko.</div></div><button class="btn btn-primary" onclick="callNext()">▶ Panggil Berikutnya</button></div><div class="queue-list">${qs.map(q=>`<div class="queue-row"><div><b>${q.number}</b> — ${esc(q.userName)}<div class="muted small">${q.orderId}</div></div><div class="mini-actions"><span class="status ${q.status==='Selesai'?'success':q.status==='Dipanggil'?'warn':''}">${q.status}</span>${q.status==='Dipanggil'?`<button class="btn btn-success" onclick="completeQueue('${q.id}')">✓ Selesaikan</button>`:''}${q.status==='Menunggu'?`<button class="btn" onclick="skipQueue('${q.id}')">⏭ Lewati</button>`:''}</div></div>`).join('')||empty('fa-ticket','Belum ada antrean')}</div>`}

function skipQueue(id){const qs=queues();const q=qs.find(x=>x.id===id);if(!q)return;q.status='Dilewati';save(LS.queues,qs);addNotification(q.userId,`Antrean ${q.number} dilewati. Silakan hubungi toko.`);render()}

function adminReport(){const os=orders(),byProduct={};os.forEach(o=>o.items.forEach(i=>byProduct[i.name]=(byProduct[i.name]||0)+i.qty));const top=Object.entries(byProduct).sort((a,b)=>b[1]-a[1]).slice(0,7);const max=top[0]?.[1]||1;const schools={};os.forEach(o=>o.items.forEach(i=>schools[i.school]=(schools[i.school]||0)+i.qty));return `<h1 class="page-title">Laporan</h1><div class="grid stats"><div class="stat"><div class="muted">Total transaksi</div><div class="num">${os.length}</div></div><div class="stat"><div class="muted">Total penjualan</div><div class="num">${money(os.reduce((a,o)=>a+o.total,0))}</div></div><div class="stat"><div class="muted">Item terjual</div><div class="num">${os.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.qty,0),0)}</div></div><div class="stat"><div class="muted">Produk habis</div><div class="num">${products().filter(p=>p.variants.every(v=>v.stock===0)).length}</div></div></div><div class="panel"><h3>Produk terlaris</h3><div class="chart">${top.map(([n,v])=>`<div class="bar" style="height:${Math.max(8,v/max*150)}px"><span>${v}</span></div>`).join('')}</div><div class="muted small">${top.map(x=>esc(x[0])).join(' • ')||'Belum ada data'}</div></div><div class="panel" style="margin-top:16px"><h3>Sekolah dengan pembelian terbanyak</h3>${Object.entries(schools).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([s,n])=>`<div class="queue-row"><b>${esc(s)}</b><span>${n} item</span></div>`).join('')||'Belum ada data'}</div>`}
function adminUsers(){const us=users();return `<h1 class="page-title">Pengguna</h1><div class="table-wrap panel"><table class="table"><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Sekolah</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${esc(u.school||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function adminSettings(){return `<h1 class="page-title">Pengaturan</h1><div class="panel" style="max-width:650px"><h3>Data Demo</h3><p class="muted">Reset akan menghapus transaksi, wishlist, antrean, voucher tambahan, dan mengembalikan produk demo.</p><button class="btn btn-danger" onclick="resetConfirm()">Reset Data Demo</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Catatan</h3><div class="notice">Aplikasi ini memakai localStorage dan tidak memiliki backend. Data hanya tersimpan pada browser/perangkat ini.</div></div>`}
function resetConfirm(){if(!confirm('Apakah Anda yakin ingin mengembalikan seluruh data ke kondisi awal?'))return;resetDemo();currentUser=users().find(x=>x.email==='admin@demo.com');save(LS.current,currentUser);page='admin';render();toast('Data demo berhasil direset.')}
setInterval(()=>{if(currentUser&&currentUser.role==='buyer'&&page==='queue'){render();setTimeout(drawQR,50)}},5000);
window.addEventListener('storage',()=>{if(currentUser)render()});
window.addEventListener('load',()=>{render();if(page==='school')filterSchools();if(page==='products')renderProductList();setTimeout(drawQR,100)});
document.addEventListener('click',e=>{if(e.target.closest('#schoolList')===null&&page==='school'){}});
const oldRender=render;render=function(){oldRender();setTimeout(()=>{if(page==='school')filterSchools();if(page==='products')renderProductList();if(page==='queue')drawQR()},30)};
</script>
</body>
</html>
